services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrailx
      POSTGRES_PASSWORD: ${GX_PG_PASSWORD:-changeme-pg}
      POSTGRES_DB: guardrailx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrailx"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GX_DATABASE_URL: postgresql+psycopg2://guardrailx:${GX_PG_PASSWORD:-changeme-pg}@db:5432/guardrailx
      GX_ENVIRONMENT: production
      GX_ADMIN_PASSWORD: ${GX_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
